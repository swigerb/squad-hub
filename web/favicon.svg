<!--
  Squad Hub, the browser-tab mark.

  DESIGNED FOR 16px, not scaled down to it. That is the whole difference: the
  favicon this replaces was a 1813x1701 photograph, and a browser reducing that
  to a 16px tab icon produces mush, which is exactly what it looked like.

  So: three filled dots, and nothing else. A squad is a team, and three nodes is
  the smallest shape that reads as "several, together" rather than "one thing".
  No connecting lines and no strokes at all, because a 2px stroke becomes a
  sixteenth of a pixel at tab size and turns the whole mark grey.

  Laid out on a 32 grid so every edge lands on a whole pixel when halved to 16.
  Transparent background, because the mark has to sit on both a light and a dark
  tab strip, and a background box would fight one of them.

  (No "-" "-" pairs in this comment: that sequence is illegal inside an XML
  comment, and an SVG that fails to parse renders as a broken-image icon. Which
  is how the first draft of this file was caught.)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Squad Hub">
  <defs>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c8dff"/>
      <stop offset="1" stop-color="#a05cff"/>
    </linearGradient>
  </defs>
  <g fill="url(#sh)">
    <circle cx="16" cy="8" r="7"/>
    <circle cx="8" cy="23" r="7"/>
    <circle cx="24" cy="23" r="7"/>
  </g>
</svg>
