<!--
  Squad Hub, the installed-app icon.

  The same three-dot mark as favicon.svg, on the dark rounded square an
  installed app needs. Kept deliberately identical in shape, because an app
  whose tab icon and home-screen icon are different drawings is an app you have
  to learn twice.

  INSET FOR MASKABLE. Android and others crop a maskable icon to whatever shape
  the launcher prefers (circle, squircle, teardrop), keeping only the central
  80%. The mark is scaled to 0.72 about the centre so the outermost dot stays
  inside that safe circle. Drawn full bleed, it would have its corners bitten
  off on exactly the platforms this icon exists for.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Squad Hub">
  <defs>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c8dff"/>
      <stop offset="1" stop-color="#a05cff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#14161a"/>
  <g fill="url(#sh)" transform="translate(256,256) scale(0.72) translate(-256,-256)">
    <circle cx="256" cy="128" r="112"/>
    <circle cx="128" cy="368" r="112"/>
    <circle cx="384" cy="368" r="112"/>
  </g>
</svg>
