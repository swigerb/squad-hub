name: Mutation acceptance

# The exhaustive gate: every runnable mutation, caught by its named test. It is
# deliberate, not part of the everyday edit loop. It runs on a manual dispatch
# and on release/* pull requests. Ordinary pull requests are gated by the
# candidate-scope workflow (candidate-acceptance.yml) instead.
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  exhaustive:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/')
    name: exhaustive acceptance
    # The catalogue includes real Windows cmd-shim and process cleanup paths.
    # Linux behavior remains covered by the separate Node 18/24 Tests matrix.
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Optional browser prerequisites live outside the checkout, so they can
      # neither dirty the source nor change its package manifest or lockfile.
      - name: Install real browser coverage outside the checkout
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'browser-tools'
          npm install --prefix $tools --no-save --package-lock=false --no-audit --no-fund playwright
          if ($LASTEXITCODE -ne 0) { Write-Error "npm install playwright failed ($LASTEXITCODE)"; exit 1 }
          & (Join-Path $tools 'node_modules\.bin\playwright.cmd') install --with-deps chromium
          if ($LASTEXITCODE -ne 0) { Write-Error "playwright install chromium failed ($LASTEXITCODE)"; exit 1 }
          "NODE_PATH=$(Join-Path $tools 'node_modules')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Check the checkout is the exact source under test
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { Write-Error "git rev-parse failed ($LASTEXITCODE)"; exit 1 }
          if ($head -ne $env:SOURCE_SHA) { Write-Error "checkout is $head, expected $env:SOURCE_SHA"; exit 1 }
          Write-Host "exhaustive acceptance of $head"

      # One coordinated run: a single shared baseline, isolated workers, and a
      # final full regression. Logs, proofs and worker copies stay outside the source.
      - name: Run the exhaustive acceptance gate
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $artifacts = Join-Path $env:RUNNER_TEMP 'acceptance-exhaustive'
          node test\acceptance.js --scope exhaustive --jobs 4 --artifacts $artifacts
          if ($LASTEXITCODE -ne 0) { Write-Error "exhaustive acceptance exited $LASTEXITCODE"; exit 1 }

      - name: Verify the report is for this scope and source
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $artifacts = Join-Path $env:RUNNER_TEMP 'acceptance-exhaustive'
          node test\acceptance.js --verify (Join-Path $artifacts 'report.json') --scope exhaustive
          if ($LASTEXITCODE -ne 0) { Write-Error "report verification exited $LASTEXITCODE"; exit 1 }

      - name: Require a clean source tree
        run: |
          $dirty = git status --porcelain
          if ($LASTEXITCODE -ne 0) { Write-Error "git status failed ($LASTEXITCODE)"; exit 1 }
          if ($dirty) { Write-Host ($dirty -join "`n"); Write-Error 'the gate left the source tree modified'; exit 1 }

      # The report names every selected, deferred and excluded mutation with its
      # logs, proofs and timings, so the whole directory is kept, pass or fail.
      - name: Preserve the complete acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-exhaustive-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/acceptance-exhaustive
          if-no-files-found: error
