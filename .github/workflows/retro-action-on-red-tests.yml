name: Retro Action on Red Tests

# Issue #100: a red `Tests` run on `main` or `dev` must leave a durable
# record. Before this workflow, the Retrospective ceremony's own trigger
# ("build failure, test failure, or reviewer rejection") had no mechanism
# that actually fired it -- a red run on the default branch left no trace
# once the next push went green.
#
# Deliberately excluded, so this stays a signal rather than noise:
#   - `cancelled` runs -- a superseded push, not a failure (issue #100 names
#     this explicitly: three cancelled runs in the review window, and an
#     issue per cancellation would train the team to ignore the label).
#   - `success` runs -- nothing to report.
#   - pull_request-triggered `Tests` runs -- the PR's own checks already
#     surface that failure to a reviewer before anything merges.
#   - feature/sprint branches -- only `main` and `dev` are shared enough that
#     a red run there affects everyone, not just the branch's author.
#
# HONEST CAVEAT ABOUT `workflow_run`: GitHub reads a `workflow_run`-triggered
# workflow's OWN YAML from the repository's DEFAULT BRANCH, not from the
# commit that produced the run it reacts to. Until this file has been merged
# to the default branch, it will not fire for ANY `Tests` run -- including
# ones on `main` happening right now. `workflow_dispatch` with a `run_id`
# below exists so this can be proven against a real, already-completed run
# once this workflow has reached the default branch, without waiting for a
# fresh failure to land.
on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'A completed Tests run id to evaluate (for proving this workflow works once it is on the default branch)'
        required: true

permissions:
  issues: write
  actions: read
  contents: read

jobs:
  record-failure:
    runs-on: ubuntu-latest
    # workflow_run: only a genuine failure (never cancelled, never success) on
    # a PUSH to main or dev. workflow_dispatch: always let the job start --
    # the step below re-checks the REAL run data anyway, so a dispatch cannot
    # be used to fabricate a record for a run that was not actually a red
    # push to main/dev.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.event == 'push' &&
       (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'dev'))
    steps:
      - uses: actions/checkout@v4

      - name: Evaluate the run and open (or skip) a durable record
        uses: actions/github-script@v7
        with:
          script: |
            const path = require('path');
            const { markerFor, hasTestsFailureMarker } = require(
              path.join(process.env.GITHUB_WORKSPACE, 'scripts', 'retro-action-closure.js'));

            const runId = context.eventName === 'workflow_dispatch'
              ? Number(context.payload.inputs.run_id)
              : context.payload.workflow_run.id;

            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: runId,
            });

            // Re-check against the REAL run, not the event payload and not the
            // dispatch input -- the same rule the job-level `if` enforces, kept
            // here too because workflow_dispatch skips that `if` entirely.
            if (run.conclusion !== 'failure') {
              core.info(`run ${runId} concluded '${run.conclusion}', not 'failure' -- nothing to record`);
              return;
            }
            if (run.event !== 'push' || !['main', 'dev'].includes(run.head_branch)) {
              core.info(`run ${runId} was a '${run.event}' event on '${run.head_branch}' -- only a push to main/dev is recorded`);
              return;
            }

            const marker = markerFor(runId);

            // Dedupe by run id: fetched locally rather than via search, so the
            // exact same body-contains check this repo tests (retro-action-closure.js)
            // is what decides duplication, not a second implementation of it.
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'retro-action', state: 'all', per_page: 100,
            });
            const already = openIssues.find((i) => hasTestsFailureMarker(i.body) && i.body.includes(marker));
            if (already) {
              core.info(`run ${runId} already has a retro-action issue: #${already.number}`);
              return;
            }

            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: runId,
            });
            const failingJobs = jobs.jobs.filter((j) => j.conclusion === 'failure').map((j) => j.name);

            const body = [
              `A \`Tests\` run **failed** on \`${run.head_branch}\` (push).`,
              '',
              `**Run:** ${run.html_url}`,
              `**Branch:** ${run.head_branch}`,
              `**Failing job(s):** ${failingJobs.length ? failingJobs.join(', ') : '(could not be determined)'}`,
              '',
              'This is the durable record issue #100 asked for: a red `Tests` run on',
              '`main` or `dev` now leaves a trace even after the next push goes green.',
              '',
              'Close this once the retrospective for this failure has been logged in',
              '`.squad/log/` (see the "Retrospective" ceremony in `.squad/ceremonies.md` and',
              '`scripts/retro-action-closure.js`).',
              '',
              `Record: ${marker}`,
            ].join('\n');

            const issue = await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Tests failed on ${run.head_branch}: run ${runId}`,
              body,
              labels: ['retro-action'],
            });
            core.info(`opened #${issue.data.number} for run ${runId}`);
